worker_processes auto;
error_log /tmp/nginx-error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path       /tmp/nginx/proxy_temp;
    fastcgi_temp_path     /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path       /tmp/nginx/uwsgi_temp;
    scgi_temp_path        /tmp/nginx/scgi_temp;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 4M;

        location = /_nginxchk {
            return 200;
        }

        # Node.js backends -- replicates the upstream haproxy ACL table
        # (docker/haproxy/haproxy.docker-compose.cfg), since haproxy is dropped
        # in this deployment and nginx is now the single front door.
        location /v3/socket.io/ {
            proxy_pass http://node:8008;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }
        location /rss_feeds/icon/ {
            proxy_pass http://node:8008;
            proxy_set_header Host $host;
        }
        location /rss_feeds/original_text_fetcher {
            proxy_pass http://node:8008;
            proxy_set_header Host $host;
        }
        location /original_page/ {
            proxy_pass http://node:8008;
            proxy_set_header Host $host;
        }

        # imageproxy -- haproxy stripped the /imageproxy prefix before forwarding
        location /imageproxy/ {
            rewrite ^/imageproxy(/.*)$ $1 break;
            proxy_pass http://imageproxy:8088;
            proxy_set_header Host $host;
        }

        # Static assets baked into this image from the web image at build time
        location /media/ {
            root /srv/newsblur;
            add_header Cache-Control "no-cache, must-revalidate";
        }
        location /static/ {
            root /srv/newsblur;
            expires max;
        }
        location = /favicon.ico {
            alias /srv/newsblur/media/img/favicon_32.png;
            expires max;
        }
        location = /robots.txt {
            alias /srv/newsblur/media/robots.txt;
            expires max;
        }
        location = /crossdomain.xml {
            alias /srv/newsblur/media/crossdomain.xml;
        }

        # Everything else -> Django/gunicorn
        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
